{% extends "base.html" %}

{% block content %}
  <section class="magic-welcome">
    <h1>Welcome To Magic Notes</h1>
  </section>

  <section class="magic-add panel">
    <h2>Add a note</h2>
    <form method="post" action="{{ url_for('notes.create') }}" id="quick-note-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="title" id="quick-note-title" value="New note">
      <textarea name="content" id="quick-note-content" rows="4" placeholder="Write your note here..." required></textarea>
      <div class="magic-form-actions">
        <button class="magic-add-button" type="submit">Add Note</button>
      </div>
    </form>
  </section>

  <section class="magic-notes">
    <h2>Your Notes</h2>
    {% if notes %}
      <div class="magic-note-grid" id="notes-grid">
        {% for note in notes %}
          <article class="magic-note searchable-note" data-search="{{ note.title }} {{ note.content }}">
            <h3><a href="{{ url_for('notes.detail', note_id=note.id) }}">{{ note.title }}</a></h3>
            <p>{{ note.content|truncate(180) }}</p>
            <div class="magic-note-actions">
              <a class="magic-edit" href="{{ url_for('notes.edit', note_id=note.id) }}">Edit Note</a>
              <form method="post" action="{{ url_for('notes.delete', note_id=note.id) }}" onsubmit="return confirm('Delete this note?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="magic-delete" type="submit">Delete Note</button>
              </form>
            </div>
          </article>
        {% endfor %}
      </div>
      <p class="magic-no-results" id="no-results" hidden>No notes found.</p>
    {% else %}
      <p class="magic-empty">You do not have any notes yet.</p>
    {% endif %}
  </section>

  <script>
    const search = document.querySelector('#note-search');
    const cards = [...document.querySelectorAll('.searchable-note')];
    const noResults = document.querySelector('#no-results');
    search?.addEventListener('input', () => {
      const query = search.value.trim().toLowerCase();
      let count = 0;
      cards.forEach(card => {
        const show = card.dataset.search.toLowerCase().includes(query);
        card.hidden = !show;
        if (show) count++;
      });
      if (noResults) noResults.hidden = count > 0;
    });

    document.querySelector('#quick-note-form')?.addEventListener('submit', () => {
      const text = document.querySelector('#quick-note-content').value.trim();
      const title = text.split(/\r?\n/)[0].slice(0, 200) || 'New note';
      document.querySelector('#quick-note-title').value = title;
    });
  </script>
{% endblock %}
