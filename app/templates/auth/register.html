{% extends "base.html" %}

{% block content %}
  <section class="panel auth-card">
    <p class="eyebrow">Tài khoản mới</p>
    <h1>Đăng ký</h1>
    <p class="muted">Tên đăng nhập 3-50 ký tự, mật khẩu tối thiểu 8 ký tự.</p>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" autocomplete="username" required maxlength="50" autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
      <label for="password_confirm">Nhập lại mật khẩu</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="8">
      <button class="button" type="submit">Tạo tài khoản</button>
    </form>
    <p class="form-footer">Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>.</p>
  </section>
{% endblock %}
