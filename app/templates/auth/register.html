{% extends "base.html" %}

{% block content %}
  <div class="auth-stage">
    <section class="panel auth-card auth-card-wide">
      <div class="auth-intro">
        <p class="eyebrow">VPS NOTES</p>
        <h1>Tạo tài khoản</h1>
        <p class="muted">Tạo không gian riêng để lưu giữ ý tưởng và công việc của bạn.</p>
      </div>
      <form method="post" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Ví dụ: nguyenvanA" required maxlength="50" autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự" required minlength="8">
        <label for="password_confirm">Xác nhận mật khẩu</label>
        <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required minlength="8">
        <button class="button auth-submit" type="submit">Tạo tài khoản</button>
      </form>
      <p class="form-footer">Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập ngay</a></p>
    </section>
  </div>
{% endblock %}
