{% extends "base.html" %}

{% block content %}
  <section class="panel auth-card">
    <p class="eyebrow">Chào mừng trở lại</p>
    <h1>Đăng nhập</h1>
    <p class="muted">Truy cập các ghi chú riêng của bạn.</p>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" autocomplete="username" required maxlength="50" autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Đăng nhập</button>
    </form>
    <p class="form-footer">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>.</p>
  </section>
{% endblock %}
