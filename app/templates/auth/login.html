{% extends "base.html" %}

{% block content %}
  <div class="auth-stage">
    <section class="panel auth-card auth-card-wide">
      <div class="auth-intro">
        <p class="eyebrow">VPS NOTES</p>
        <h1>Đăng nhập</h1>
        <p class="muted">Đăng nhập để tiếp tục quản lý những ghi chú riêng của bạn.</p>
      </div>
      <form method="post" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập" required maxlength="50" autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
        <button class="button auth-submit" type="submit">Đăng nhập</button>
      </form>
      <p class="form-footer">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Tạo tài khoản mới</a></p>
    </section>
  </div>
{% endblock %}
